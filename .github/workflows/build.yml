name: Build profile card
on:
  schedule:
    - cron: "17 * * * *"  # hourly; off the top of the hour, when GitHub delays scheduled runs
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: build-profile-card
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Build SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jeswinbenedict
        run: python scripts/build_profile.py
      - name: Commit and push SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile card [skip ci]"
          git pull --rebase origin main
          git push
